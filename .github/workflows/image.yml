name: Image

# Construye la imagen del frontend y la publica en GHCR. Coolify solo hace pull.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stack:
        description: "Publicar también la imagen sha-<7>-stack (API interna http://api:8000)"
        type: boolean
        default: false

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha para rollback pinneado, la rama para seguir main, la versión en los
      # tags v* y latest solo en la rama por defecto.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL || 'https://api-memberplus.neyzt.org' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Coolify debe apuntar a un tag de versión fijo; \`latest\` no se usa en producción."
          } >> "$GITHUB_STEP_SUMMARY"

  # Imagen para el stack local de respaldo (perfil `stack` del compose del
  # backend). El rewrite de /api/* se hornea en el build, así que esta copia
  # apunta al servicio `api` de la red de Compose y no al dominio público:
  # NO se despliega en Coolify. El tag es inmutable (`sha-<7>-stack`, ligado
  # al commit), como el resto de las imágenes del proyecto. Se publica a mano
  # desde Actions → Image → Run workflow, marcando la casilla `stack`.
  stack:
    name: stack
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-,suffix=-stack

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_INTERNAL_URL=http://api:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen de respaldo publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Tag inmutable, solo para el perfil \`stack\` del compose del backend (no se despliega en Coolify)."
            echo "En el compose: \`WEB_IMAGE_TAG=<tag>\` (ver docs/DEPLOY.md sección 9)."
          } >> "$GITHUB_STEP_SUMMARY"

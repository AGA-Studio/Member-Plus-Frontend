name: Image

# Construye la imagen del frontend y la publica en GHCR. Coolify solo hace pull.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha para rollback pinneado, la rama para seguir main, la versión en los
      # tags v* y latest solo en la rama por defecto.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mergear a main DESPLIEGA: el stack de Coolify apunta al tag movil
      # `latest`, así que hay que pedirle que jale la imagen y se redespliegue.
      # Solo en `main`: un tag v* publica versión y no debe redisparar el deploy
      # del mismo commit. Si el secreto no está configurado, el paso no falla
      # (repo recién clonado o fork), solo avisa.
      - name: Pedir deploy a Coolify
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Sin COOLIFY_TOKEN configurado: la imagen quedó publicada y el deploy es manual."
            exit 0
          fi
          # El webhook del stack no jala imagen nueva: hace force-recreate sobre
          # la que ya está en caché (bug coollabsio/coolify#5318). En su lugar se
          # llama al gemelo en el API del botón "Pull latest images and restart"
          # (POST /services/{uuid}/restart?latest=true, coollabsio/coolify#5881),
          # que hace el pull antes de recrear (issue #105).
          code=$(curl -sS -o /tmp/coolify.out -w '%{http_code}' --max-time 30 \
            -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.neyzt.org/api/v1/services/6kinjpovwb9ucyqf5ogy9igt/restart?latest=true")
          echo "Coolify respondió HTTP $code"
          cat /tmp/coolify.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Coolify apunta a \`latest\`: un push a main la publica y dispara el deploy."
          } >> "$GITHUB_STEP_SUMMARY"
